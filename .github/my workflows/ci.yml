name: CI

on:
  push:
    branches:
      - dev
      - dev-next
      - next
      - beta
      - alpha
      - "*.x"
    paths:
      - "**.ts"
      - ".github/workflows/**.yml"
      - ".github/actions/**.yml"
      - "src/**"
      - "test/**"
      - "*.json"
      - "*.yaml"
  pull_request:
    paths:
      - "**.ts"
      - ".github/workflows/**.yml"
      - ".github/actions/**.yml"
      - "src/**"
      - "test/**"
      - "*.json"
      - "*.yaml"
    types:
      - opened
      - synchronize
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install
      - run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: newtab-redirect-*.zip
