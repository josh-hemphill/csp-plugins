name: CI

on:
  push:
    branches:
      - latest
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22'
          - '24'
          - '26'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - run: pnpm run build:all
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:markdown
      - run: pnpm spell
      - run: pnpm fmt:check
      - run: pnpm test
