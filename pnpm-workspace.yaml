packages:
  - packages/*
  - packages/*/playground

catalogs:
  build:
    obuild: ^0.4.1
    typedoc: ^0.28.14
    typescript: ^5.9.3
  dev:
    '@antfu/eslint-config': ^6.2.0
    bumpp: ^10.3.1
    changelogithub: ^13.16.1
    commitizen: ^4.3.1
    cspell: ^9.3.0
    eslint: ^9.39.1
    gh-pages: ^6.3.0
    markdownlint-cli2: ^0.18.1
    mock-fs: ^5.5.0
    tsx: ^4.20.6
    zx: ^8.8.5
  logging:
    loglevel: ^1.9.2
  parsing:
    cheerio: 1.1.2
    dom-serializer: ^2.0.0
    domhandler: ^5.0.3
    domutils: ^3.2.2
    htmlparser2: ^10.0.0
  plugin-systems:
    esbuild: ^0.26.0
    rollup: ^4.53.1
    unplugin: ^2.3.10
    vite: npm:rolldown-vite@^7.2.2
    vite-plugin-inspect: ^11.3.3
    webpack: ^5.102.1
  test:
    '@vitest/coverage-v8': ^4.0.8
    puppeteer: ^24.29.1
    vitest: ^4.0.8
  types:
    '@types/node': ^24.10.0

onlyBuiltDependencies:
  - esbuild
  - puppeteer
  - unrs-resolver

packageExtensions:
  zx:
    dependencies:
      '@types/fs-extra': latest
      fs-extra: latest
      minimist: latest

peerDependencyRules:
  allowAny:
    - vite

includeWorkspaceRoot: true
ignoreWorkspaceRootCheck: true
shamefullyHoist: true
