packages:
  - packages/*
  - packages/*/playground
  - packages/e2e-tests/test-app

# catalogMode only gates the default `catalog:` (this repo has none).
# Add deps with: pnpm add <pkg> --save-catalog-name <build|dev|...>
catalogMode: strict
verifyDepsBeforeRun: install
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

catalogs:
  build:
    obuild: ^0.4.39
    typedoc: ^0.28.20
    typescript: ~6.0.3
  dev:
    cspell: ^10.3.0
    jsr: ^0.14.3
    markdownlint-cli2: ^0.23.2
    oxfmt: ^0.67.0
    oxlint: ^1.82.0
    tsx: ^4.23.13
    zx: ^8.8.5
  logging:
    loglevel: ^1.9.2
  parsing:
    dom-serializer: ^3.1.1
    domhandler: ^6.0.1
    domutils: ^4.0.2
    htmlparser2: ^12.0.0
  plugin-systems:
    esbuild: ^0.28.2
    rollup: ^4.63.1
    unplugin: ^3.3.0
    vite: ^8.3.0
    vite-plugin-inspect: ^12.0.2
    webpack: ^5.110.3
  test:
    '@vitest/coverage-v8': ^5.0.0
    puppeteer: ^25.10.0
    vitest: ^5.0.0
  types:
    '@types/node': ^24.13.4

allowBuilds:
  esbuild: true
  puppeteer: true
  unrs-resolver: true

includeWorkspaceRoot: true
ignoreWorkspaceRootCheck: true
